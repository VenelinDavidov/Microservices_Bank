spring:
  application:
    name: "configserver"
  profiles:
#     active: native
    active: git
  cloud:
    config:
      server:
#        native:
#         search-locations: "classpath:/config"                                       classpath location
#          search-locations: "file:///C://Users//VITORIYA//Documents//config"          #file system location
        git:
          uri: "https://github.com/VenelinDavidov/spring-config.git"
          default-label: main
          timeout: 5
          clone-on-start: true
          force-pull: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

encrypt:
  key: "12F32DE2343DF23DFE12359F123F123F123F123F"

server:
 port: 8071

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{trace_id},%X{span_id}]"